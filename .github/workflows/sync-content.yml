name: Sync stormlog content

# Keeps the landing site in lockstep with stormlog releases:
#   1. Refreshes the auto-generated version constant from PyPI.
#   2. If a new stormlog release exists, regenerates the "What's New"
#      JSON via an LLM (Anthropic -> Gemini -> Groq, based on which
#      API key secret is set).
#   3. If anything changed, opens a PR against dev for human review
#      before the new content reaches main / production.
#
# Trigger surface:
#   - Hourly cron (catches releases within an hour of publication).
#   - Manual workflow_dispatch with an optional `force` input that
#     regenerates the What's New content even if the version matches.
#   - repository_dispatch with `event_type: stormlog-release` so the
#     stormlog repo can push instant updates when it cuts a release
#     (see docs in this workflow's tail comment).

on:
  schedule:
    - cron: "17 * * * *" # hourly, offset so we don't pile onto :00
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate What's New content even if version matches"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
  repository_dispatch:
    types: [stormlog-release]

concurrency:
  group: sync-content
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Refresh version + What's New
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh stormlog version constant
        run: npm run sync-version

      - name: Regenerate What's New content
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '0' }}
        run: node scripts/generate-updates.mjs

      - name: Validate generated content
        run: npm run validate-updates

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/data/stormlog-version.ts src/data/updates.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat -- src/data/stormlog-version.ts src/data/updates.json
          fi

      - name: Open / update PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Fine-grained PAT scoped to this repo only (contents: write,
          # pull-requests: write). Using a PAT instead of GITHUB_TOKEN so the
          # resulting PR triggers CI (PRs created by GITHUB_TOKEN do not).
          token: ${{ secrets.CONTENT_SYNC_PAT }}
          branch: bot/sync-stormlog-content
          base: dev
          commit-message: |
            chore(content): sync stormlog v${{ steps.gen.outputs.version }}

            - Refresh stormlog version constant
            - Regenerate What's New content from release notes
              ${{ steps.gen.outputs.release_url }}
            - Provider: ${{ steps.gen.outputs.provider || 'template' }}
          title: "chore(content): sync stormlog v${{ steps.gen.outputs.version }}"
          body: |
            Automated sync triggered by `${{ github.event_name }}`.

            **Version**: `v${{ steps.gen.outputs.previous_version }}` → `v${{ steps.gen.outputs.version }}`
            **Provider**: `${{ steps.gen.outputs.provider || 'template' }}`
            **Release**: ${{ steps.gen.outputs.release_url }}

            ### Review checklist
            - [ ] `src/data/stormlog-version.ts` reflects the new version.
            - [ ] `src/data/updates.json` accurately summarizes the release notes.
            - [ ] `meta.description`, `kicker`s, and `summary`s match Stormlog's voice.
            - [ ] `command` and `code` snippets are runnable / accurate.
            - [ ] `externalLink`s resolve.

            If the generated content is off, edit `src/data/updates.json` directly
            on this branch — the PR will pick up the changes. The next sync run
            will only overwrite if a *newer* stormlog version is published.

            Generated by `.github/workflows/sync-content.yml`.
          labels: |
            automated
            content-sync
          delete-branch: true

# How to wire instant updates from the stormlog repo (optional):
# Add the following step to stormlog's "publish to PyPI" workflow, AFTER the
# release is published successfully:
#
#   - name: Notify landing site
#     env:
#       GH_PAT: ${{ secrets.LANDING_REPO_DISPATCH_TOKEN }}  # PAT with `repo` scope on nanaagyei/stormlog-landing
#     run: |
#       curl -sf -X POST \
#         -H "Authorization: token $GH_PAT" \
#         -H "Accept: application/vnd.github+json" \
#         https://api.github.com/repos/nanaagyei/stormlog-landing/dispatches \
#         -d '{"event_type":"stormlog-release","client_payload":{"version":"${{ github.ref_name }}"}}'
#
# Without this, the hourly cron above is the safety net (max ~1 hour latency).
